name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild -project OfficeLight.xcodeproj -scheme OfficeLight \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- test
